<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuwait Theater Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Kuwait Theater Booking</h1>

    <!-- Navigation Bar -->
    <nav id="navbar">
        <a href="index.html">Home</a> |
        <a href="shows.html">Shows</a> |
        <a href="booking.html">Booking</a> |
        <a href="contact.html">Contact</a> |
        <a href="book.html">Book Now</a>
    </nav>
</header>

 
    <!-- Booking Form -->
     <div class="form">
    <h2 id="book">Book Your Tickets</h2>

    <form>

        <label for="fullname">Full Name:</label><br>
        <input type="text" id="fullname" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" required><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" required><br><br>

        <label for="show">Select Show:</label><br>
        <select id="show" required>
            <option value="">Choose a Show</option>
            <option>The Lion King</option>
            <option>Aladdin</option>
            <option>Kuwaiti Comedy Night</option>
        </select><br><br>

        <label for="tickets">Number of Tickets:</label><br>
        <input type="number" id="tickets" min="1" required><br><br>

        <label for="date">Show Date:</label><br>
        <input type="date" id="date" required><br><br>

        <input type="submit" value="Book Ticket">

    </form>
    </div>

</body>
</html>
